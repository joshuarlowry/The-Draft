  title: 'Governance and Guardrails'
  description: 'Evidence that oversight is shifting toward gates, policies, and technical guardrails.'

- id: tooling-guardrails
  title: 'Tooling Guardrails'
  description: 'Research on technical guardrails like static analysis, multi-agent validation, and automated testing that make AI output safer to integrate.'

- id: rapid-prototyping
  title: 'Rapid Prototyping with AI'
  description: 'Sources on how AI tooling compresses time-to-first-build and enables faster iteration toward functional prototypes.'

- id: usability-inspection
  title: 'Usability Inspection and Heuristic Evaluation'
  description: 'References that define heuristic evaluation and other inspection methods used to catch usability issues before user testing.'

- id: cross-domain-calibration
  title: 'Cross-Domain Calibration: UX and Agentic AI'
  description: 'Articles that bridge UX research and agentic AI, exploring how design principles and user experience models must adapt when systems act with greater autonomy.'

- id: terminal-interfaces
  title: 'Terminal Interfaces for Agentic Work'
  description: 'Sources that argue command-line and terminal interfaces are becoming a primary surface for LLM and agent workflows.'

- id: ai-ux-role-shifts
  title: 'AI Role Shifts in UX Research, Design, and Strategy'
  description: 'Sources examining whether AI is replacing UX roles or augmenting them by reshaping collaboration, trust, and strategic responsibilities.'

- id: ai-harnesses
  title: 'AI Harnesses and Agent Workbenches'

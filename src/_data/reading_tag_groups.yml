  description: Implemented workflows and research on tool protocols, context compaction, approval boundaries, and executable feedback.

- id: local-model-field-research
  title: Local Model Field Research and Author Perspectives
  description: Practitioner trials, architecture explanations, harness experiments, and implementation guides discovered from the initial model survey.


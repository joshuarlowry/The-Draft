reading_descriptions:
  ux: >-
    Canales frames handmade signs as vernacular design evidence: people annotate confusing systems so the next person
    can understand what to do.
  ia: >-
    The talk treats public instructions as lightweight information architecture that repairs gaps between built systems
    and situated human behavior.

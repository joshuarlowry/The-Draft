source_id: canales_there_i_fixed_it
summary: >-
  There, I Fixed It is Kate Canales's public-facing collection of handmade signs and improvised instructions from
  everyday environments.
long_summary: >-
  The project documents the notes people leave on doors, bathrooms, payment devices, office equipment, and other
  mundane systems when use is not self-evident. As a research artifact, the collection makes visible the unofficial
  instruction layer that appears around confusing products and places. It complements Canales's TED talk by giving the
  underlying photo archive a public home and inviting others to contribute examples of vernacular design repair.
source_type: article
key_takeaways:
  - Document improvised instructions as evidence of where everyday interfaces need extra explanation
  - Treat handwritten notes as design artifacts that translate local context into action
  - Invite contributions so the collection reflects distributed noticing rather than one designer's observations alone
  - Use the archive to study how people repair gaps in physical-world information systems
relevance: >-
  The collection matters to The Draft because it turns everyday confusion into inspectable design evidence. It supports
  the site's interest in oversight and rapid prototyping by showing how real users create feedback loops when systems do
  not explain themselves.

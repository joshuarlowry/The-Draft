source_id: ted_canales_makeshift_signs
summary: >-
  Kate Canales argues that handmade, improvised signs are not just jokes or clutter; they are everyday acts of design
  that appear when products, places, or services fail to explain themselves clearly.
long_summary: >-
  In this TEDNext 2025 talk, designer and professor Kate Canales draws on more than 20 years of photographing handmade
  signs in public places. Her examples show people adding extra instructions to doors, bathrooms, point-of-sale machines,
  and other everyday systems when the official design does not provide enough guidance. For The Draft, the talk is useful
  because it reframes informal annotations as evidence of human-centered repair: people create local information
  architecture at the point of confusion so others can move through the same system with less friction.
source_type: video
key_takeaways:
  - Treat improvised signs as evidence that the designed system did not communicate enough on its own
  - Notice vernacular instructions as lightweight information architecture embedded in physical environments
  - Study everyday breakdowns because they reveal the gap between intended workflows and situated human behavior
  - Value small acts of public explanation as design work that improves the next person's experience
relevance: >-
  Canales's work connects directly to The Draft's interest in planning, oversight, and experience design because it shows
  that systems need repairable communication layers. The talk also offers a practical lens for AI-assisted product work:
  faster execution still has to be checked against what people actually need to understand in context.

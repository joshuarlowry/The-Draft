source_id: anthropic_harness_design_long_running_apps
source_type: article
summary: >-
  Anthropic describes a multi-agent harness for frontend and full-stack application generation, using planner,
  generator, and evaluator roles to produce richer long-running outputs.
long_summary: >-
  Rajasekaran reports on experiments that moved beyond prompt-only improvements into harness architecture. The work
  starts with frontend design, where a generator/evaluator loop turns subjective judgment into explicit criteria, then
  extends to full-stack app generation with planner, generator, and evaluator agents. The article highlights that newer
  models can make some scaffolding obsolete, but also argues that stronger models open new space for higher-order
  harness combinations. It is a useful marker of the recent shift from single-agent prompting to engineered loops,
  contracts, QA agents, and tool-mediated evaluation.
key_takeaways:
  - Separate planning, generation, and evaluation when tasks exceed what the base model reliably handles alone
  - Use criteria, contracts, and Playwright-style interaction to make subjective or product-quality checks more concrete
  - Revisit harness complexity after model upgrades because load-bearing scaffolding can become dead weight
  - Treat harness design as moving frontier work rather than a one-time wrapper around a model
relevance: >-
  This source directly supports The Draft's emphasis on operating discipline, evaluation, and human-authored scaffolds
  that make agentic development reliable enough for real product work.
notable_quotes:
  - 'The final result was a three-agent architecture—planner, generator, and evaluator—that produced rich full-stack applications over multi-hour autonomous coding sessions.'

source_id: langgraph_persistence
summary: Checkpointers preserve thread state; stores preserve cross-thread application data.
long_summary: In-memory checkpoints disappear on restart. Durable recovery requires persistent storage, stable run identity, and a tested recovery procedure.
source_type: documentation
key_takeaways:
  - Separate run state from shared memory.
  - Choose persistent checkpoint storage.
  - Test recovery across process restarts.
relevance: Clarifies what a resumable local workflow must actually persist.

profile_summary: >-
  Kate Canales is a designer, educator, and Professor of Practice in Design at The University of Texas at Austin.
  Her work explores how everyday systems shape human behavior, including design research, ethnography, prototyping,
  collaboration, and the improvised public instructions people create when formal systems fall short.
